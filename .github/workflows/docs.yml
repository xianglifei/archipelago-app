# 文档站 CI:PR 只构建(产物作为可下载预览),main 推送才部署。
#
# 为什么独立工作流而不并进 ci.yml:
# - 文档站是独立的 npm 工程(docs/ 有自己的 lockfile),装依赖与构建都跟客户端无关
# - 纯文档改动不该拖慢客户端质量闸,也不该被 Electron 构建失败连坐
#
# 需要仓库 Secret(部署 job):
#   CLOUDFLARE_API_TOKEN   —— 最小权限:Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID  —— 账号 ID
# 没配也没关系:PR 仍然构建并给出可下载产物,只是不会发预览版本。
name: docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-deploy.mjs'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs-deploy.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 安装文档站依赖
        run: npm --prefix docs ci
      - name: 静态导出
        run: npm --prefix docs run build
      - name: 产物自检(不部署)
        run: node scripts/docs-deploy.mjs --skip-build --dry-run
      - name: 上传预览产物
        uses: actions/upload-artifact@v4
        with:
          name: docs-out-${{ github.run_id }}
          path: docs/out
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://docs.qundao.app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 安装文档站依赖
        run: npm --prefix docs ci
      - name: 缺少 Cloudflare 凭据时提前失败(而不是部署到一半)
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo '✗ 未配置 CLOUDFLARE_API_TOKEN,无法部署' >&2 && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo '✗ 未配置 CLOUDFLARE_ACCOUNT_ID,无法部署' >&2 && exit 1)
      - name: 构建 + 部署 + 线上探活
        run: node scripts/docs-deploy.mjs

  # 同仓 PR 发一个 Cloudflare 预览版本(preview alias),给评审直接点开的 URL。
  # fork PR 拿不到 Secret,这一步会整体跳过——构建产物仍可从 build job 的 artifact 下载。
  # 预览失败不阻塞合并:continue-on-error。
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm --prefix docs ci
      - run: npm --prefix docs run build
      - name: 上传预览版本(有凭据时)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: docs
        run: npx wrangler versions upload -c wrangler.jsonc --preview-alias "pr-${{ github.event.number }}"
