<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CD0E6"/>
      <stop offset="1" stop-color="#3F9FD4"/>
    </linearGradient>
  </defs>

  <!-- 海域(squircle 背景) -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#sea)"/>

  <!-- 云 -->
  <g fill="#FFFFFF" opacity="0.95">
    <ellipse cx="770" cy="252" rx="112" ry="52"/>
    <circle cx="726" cy="214" r="46"/>
    <circle cx="812" cy="212" r="38"/>
  </g>

  <!-- 浮岛(整体下移让重心更稳):树 + 草皮 + 土层 -->
  <g transform="translate(0,44)">
    <!-- 树冠与树干(树干加深扎入草皮,被草皮遮住底部) -->
    <circle cx="501" cy="292" r="112" fill="#5FA34E"/>
    <rect x="484" y="330" width="34" height="150" rx="17" fill="#8A6A4A"/>

    <!-- 草皮 + 土层(土层下延,减少下部留白) -->
    <rect x="256" y="440" width="490" height="118" rx="59" fill="#9BCB5C"/>
    <path d="M296 552 L706 552 Q716 552 712 562 L664 712 Q655 744 622 744 L380 744 Q347 744 338 712 L290 562 Q286 552 296 552 Z" fill="#D8B078"/>
  </g>

  <!-- 波浪(加大并补一条,填充下部空间) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.85">
    <path d="M140 880 q 46 -32 92 0 q 46 32 92 0"/>
    <path d="M680 900 q 46 -32 92 0 q 46 32 92 0"/>
  </g>
</svg>
