<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8E4F5"/>
      <stop offset="1" stop-color="#5BBEE8"/>
    </linearGradient>
    <filter id="g1-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B5E86" flood-opacity="0.22"/>
    </filter>
    <filter id="g1-tiny" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B5E86" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 动森粉青天空 -->
  <rect width="1024" height="1024" rx="230" fill="url(#g1-sky)"/>

  <!-- 胖云(右上) -->
  <g fill="#FFFFFF" opacity="0.94">
    <ellipse cx="830" cy="215" rx="92" ry="40"/>
    <circle cx="798" cy="187" r="36"/>
    <circle cx="861" cy="184" r="31"/>
  </g>

  <!-- ===== 主岛(大):发光浅海→沙滩→草地 ===== -->
  <ellipse cx="430" cy="652" rx="372" ry="212" fill="#C9F2EA" opacity="0.5"/>
  <g filter="url(#g1-soft)">
    <ellipse cx="430" cy="650" rx="340" ry="192" fill="#9FE8DC"/>
    <ellipse cx="430" cy="648" rx="305" ry="168" fill="#F2E0A8"/>
    <ellipse cx="430" cy="645" rx="272" ry="146" fill="#8CD652"/>
  </g>

  <!-- ===== 主岛:帐篷居中放大,左右两棵对称树,干净利落 ===== -->
  <g filter="url(#g1-tiny)">
    <!-- 左树 -->
    <rect x="272" y="550" width="24" height="78" rx="12" fill="#8A6A4A"/>
    <circle cx="284" cy="512" r="60" fill="#4E9C2E"/>
    <circle cx="264" cy="492" r="19" fill="#6BB838"/>
    <!-- 右树(与左树镜像对称) -->
    <rect x="544" y="550" width="24" height="78" rx="12" fill="#8A6A4A"/>
    <circle cx="556" cy="512" r="60" fill="#4E9C2E"/>
    <circle cx="536" cy="492" r="19" fill="#6BB838"/>
  </g>

  <g filter="url(#g1-tiny)">
    <!-- 岛主之帐:黄色圆角三角帐篷,正居主岛中央 -->
    <polygon points="322,600 430,415 538,600" fill="#F2C94C" stroke="#F2C94C" stroke-width="28" stroke-linejoin="round"/>
    <path d="M 398 600 Q 430 525 462 600 Z" fill="#7A5B36"/>
    <circle cx="430" cy="418" r="11" fill="#D9A82E"/>
  </g>

  <!-- ===== 小小岛:发光浅海→沙滩→草地 + 一棵小树 ===== -->
  <ellipse cx="838" cy="797" rx="168" ry="95" fill="#C9F2EA" opacity="0.45"/>
  <g filter="url(#g1-soft)">
    <ellipse cx="838" cy="795" rx="150" ry="84" fill="#9FE8DC"/>
    <ellipse cx="838" cy="794" rx="127" ry="69" fill="#F2E0A8"/>
    <ellipse cx="838" cy="793" rx="104" ry="55" fill="#8CD652"/>
  </g>
  <g filter="url(#g1-tiny)">
    <rect x="832" y="742" width="14" height="48" rx="7" fill="#8A6A4A"/>
    <circle cx="839" cy="724" r="34" fill="#4E9C2E"/>
    <circle cx="828" cy="713" r="11" fill="#6BB838"/>
  </g>

  <!-- 岛间航线(点线,岛与岛相连成群岛) -->
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="722" cy="680" r="7"/>
    <circle cx="746" cy="706" r="7"/>
    <circle cx="770" cy="732" r="7"/>
  </g>

  <!-- 海面波浪 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.85">
    <path d="M 138 328 q 42 -30 84 0 q 42 30 84 0"/>
    <path d="M 742 508 q 42 -30 84 0 q 42 30 84 0"/>
    <path d="M 150 908 q 42 -30 84 0 q 42 30 84 0"/>
    <path d="M 620 932 q 42 -30 84 0 q 42 30 84 0"/>
  </g>
</svg>
